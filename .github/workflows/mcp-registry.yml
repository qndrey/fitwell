name: Publish to MCP Registry

# Publishes apps/mcp/registry/server.json to the official MCP Registry (registry.modelcontextprotocol.io) as
# fyi.fitwell/fitwell. Run by hand from the Actions tab after bumping "version" in server.json: a version can be
# published only once. Setup (DNS key and the MCP_PRIVATE_KEY secret): apps/mcp/registry/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The release archive is checked against its Sigstore signature from the registry's own release workflow.
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate apps/mcp/registry/server.json

      # Proves control of fitwell.fyi with the TXT record "v=MCPv1; k=ed25519; p=..." on the apex.
      - name: Log in (DNS, fitwell.fyi)
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain fitwell.fyi

      - name: Publish
        run: ./mcp-publisher publish apps/mcp/registry/server.json
