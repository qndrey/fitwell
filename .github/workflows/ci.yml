name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# One run per branch; a newer push cancels the older run (but never on main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Actions are pinned to full commit SHAs (a tag can be moved). Dependabot proposes updates (see dependabot.yml).
jobs:
  # Typecheck, lint and unit tests of every workspace (packages/core and apps/mcp).
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The workout player tests drive the built view in a real Chromium (tests/support/workoutHost.ts).
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm test
