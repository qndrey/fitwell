name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# One run per branch; a newer push cancels the older run (but never on main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Actions are pinned to full commit SHAs (a tag can be moved). Dependabot proposes updates (see dependabot.yml).
jobs:
  # Typecheck, lint and unit tests of every workspace (packages/core and apps/mcp).
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
